        function structuredCloneSafe(obj) {
          return JSON.parse(JSON.stringify(obj));
        }

        function readJSON(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) return structuredCloneSafe(fallback);
            const parsed = JSON.parse(raw);
            return parsed !== null && parsed !== undefined ? parsed : structuredCloneSafe(fallback);
          } catch (err) {
            console.error('[DataStore] Failed to read key:', key, err);
            return structuredCloneSafe(fallback);
          }
        }

        function writeJSON(key, value) {
          try {
            localStorage.setItem(key, JSON.stringify(value));
            return true;
          } catch (err) {
            console.error('[DataStore] Failed to write key:', key, err);
            return false;
          }
        }

        // --- Firebase Cloud Firestore Bootstrap & Real-Time Listeners ---
        async function seedCloudIfEmpty() {
          if (!firestoreDb) return;
          try {
            // 1. Site config document
            const siteDocRef = doc(firestoreDb, 'site', 'config');
            const siteSnap = await getDoc(siteDocRef);
            if (!siteSnap.exists()) {
              await setDoc(siteDocRef, getSiteData());
            }

            // 2. Projects collection
            const projSnap = await getDocs(collection(firestoreDb, 'projects'));
            if (projSnap.empty) {
              const localProjects = getProjects();
              await Promise.all(
                localProjects.map(p => setDoc(doc(firestoreDb, 'projects', p.id), p))
              );
            }

            // 3. FAQs collection
            const faqSnap = await getDocs(collection(firestoreDb, 'faqs'));
            if (faqSnap.empty) {
              const localFaqs = getFaqs();
              await Promise.all(
                localFaqs.map((f, idx) => setDoc(doc(firestoreDb, 'faqs', f.id), { ...f, order: idx }))
              );
            }

            // 4. Questions collection
            const qSnap = await getDocs(collection(firestoreDb, 'questions'));
            if (qSnap.empty) {
              const localQuestions = getQuestions();
              await Promise.all(
                localQuestions.map(q => setDoc(doc(firestoreDb, 'questions', q.id), q))
              );
            }
          } catch (err) {
            console.warn('[Firebase] Seed check warning (check Firestore rules if permission denied):', err);
            setCloudStatus('offline', 'Cloud Firestore unreachable (using local cache). Check Firestore security rules.');
          }
        }

        async function initCloudSync() {
          if (!firestoreDb) {
            setCloudStatus('offline', 'Firebase SDK unavailable — using localStorage cache.');
            return;
          }

          try {
            // Real-time listener for site/config
            onSnapshot(
              doc(firestoreDb, 'site', 'config'),
              (snap) => {
                if (snap.exists()) {
                  const merged = {
                    ...structuredCloneSafe(DEFAULT_SITE_DATA),
                    ...snap.data()
                  };
                  writeJSON(STORAGE_KEYS.SITE_DATA, merged);
                  setCloudStatus('synced', 'Synced live with Firebase Cloud (softstreamswebwork-e6518)');
                }
              },
              (err) => {
                console.warn('[Firebase] site/config snapshot error:', err);
                setCloudStatus('offline', 'Cloud sync paused (local cache active): ' + (err.code || 'offline'));
              }
            );

            // Real-time listener for projects
            onSnapshot(
              collection(firestoreDb, 'projects'),
              (snapshot) => {
                if (!snapshot.empty) {
                  const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                  list.sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
                  writeJSON(STORAGE_KEYS.PROJECTS, list);
                  setCloudStatus('synced', 'Synced live with Firebase Cloud (softstreamswebwork-e6518)');
                }
              },
              (err) => console.warn('[Firebase] projects snapshot error:', err)
            );

            // Real-time listener for faqs
            onSnapshot(
              collection(firestoreDb, 'faqs'),
              (snapshot) => {
                if (!snapshot.empty) {
                  const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                  list.sort((a, b) => (Number(a.order ?? 999) - Number(b.order ?? 999)));
                  writeJSON(STORAGE_KEYS.FAQS, list);
                  setCloudStatus('synced', 'Synced live with Firebase Cloud (softstreamswebwork-e6518)');
                }
              },
              (err) => console.warn('[Firebase] faqs snapshot error:', err)
            );

            // Real-time listener for questions
            onSnapshot(
              collection(firestoreDb, 'questions'),
              (snapshot) => {
                if (!snapshot.empty) {
                  const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                  list.sort((a, b) => String(b.timestamp || '').localeCompare(String(a.timestamp || '')));
                  writeJSON(STORAGE_KEYS.QUESTIONS, list);
                  setCloudStatus('synced', 'Synced live with Firebase Cloud (softstreamswebwork-e6518)');
                }
              },
              (err) => console.warn('[Firebase] questions snapshot error:', err)
            );
          } catch (err) {
            console.error('[Firebase] Failed attaching snapshot listeners:', err);
            setCloudStatus('offline', 'Running in offline local cache mode.');
          }
        }

        // --- Site Content & Reviews API ---
        function getSiteData() {
          const current = readJSON(STORAGE_KEYS.SITE_DATA, DEFAULT_SITE_DATA);
          return {
            ...structuredCloneSafe(DEFAULT_SITE_DATA),
            ...current,
            hero: { ...DEFAULT_SITE_DATA.hero, ...(current.hero || {}) },
            about: { ...DEFAULT_SITE_DATA.about, ...(current.about || {}) },
            contact: { ...DEFAULT_SITE_DATA.contact, ...(current.contact || {}) },
            reviews: Array.isArray(current.reviews) ? current.reviews : structuredCloneSafe(DEFAULT_SITE_DATA.reviews),
            valueProps: Array.isArray(current.valueProps) ? current.valueProps : structuredCloneSafe(DEFAULT_SITE_DATA.valueProps)
          };
        }

        function saveSiteData(nextData) {
          const merged = { ...getSiteData(), ...nextData };
          writeJSON(STORAGE_KEYS.SITE_DATA, merged);
          notifyListeners();

          if (firestoreDb) {
            setDoc(doc(firestoreDb, 'site', 'config'), merged, { merge: true })
              .then(() => setCloudStatus('synced', 'Synced live with Firebase Cloud (softstreamswebwork-e6518)'))
              .catch(err => console.error('[Firebase] saveSiteData failed:', err));
          }
          return merged;
        }

        // --- Projects API ---
        function getProjects() {
          const list = readJSON(STORAGE_KEYS.PROJECTS, DEFAULT_PROJECTS);
          return Array.isArray(list) ? list : [];
        }

        function saveProject(projectInput) {
          const list = getProjects();
          const title = (projectInput.title || '').trim();
          const category = (projectInput.category || 'Business Website').trim();
          const fallbackImg = makeProjectSvgDataUrl(
            title || 'Client Project',
            category,
            '#14b8a6',
            '#0b1526'
          );
          const newProject = {
            id: 'proj-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            title: title || 'Untitled Project',
            category,
            description: (projectInput.description || '').trim(),
            url: (projectInput.url || '').trim(),
            image: (projectInput.image && projectInput.image.trim()) ? projectInput.image.trim() : fallbackImg,
            featured: Boolean(projectInput.featured),
            createdAt: new Date().toISOString()
          };
          list.unshift(newProject);
          writeJSON(STORAGE_KEYS.PROJECTS, list);
          notifyListeners();

          if (firestoreDb) {
            setDoc(doc(firestoreDb, 'projects', newProject.id), newProject)
              .then(() => setCloudStatus('synced', 'Project synced to Firebase Cloud'))
              .catch(err => console.error('[Firebase] saveProject failed:', err));
          }
          return newProject;
        }

        function updateProject(projectId, updates) {
          const list = getProjects();
          const idx = list.findIndex(p => p.id === projectId);
          if (idx === -1) return null;
          list[idx] = {
            ...list[idx],
            ...updates,
            title: updates.title !== undefined ? updates.title.trim() : list[idx].title,
            category: updates.category !== undefined ? updates.category.trim() : list[idx].category,
            description: updates.description !== undefined ? updates.description.trim() : list[idx].description,
            url: updates.url !== undefined ? updates.url.trim() : list[idx].url,
            image: (updates.image && updates.image.trim()) ? updates.image.trim() : list[idx].image
          };
          writeJSON(STORAGE_KEYS.PROJECTS, list);
          notifyListeners();

          if (firestoreDb) {
            setDoc(doc(firestoreDb, 'projects', projectId), list[idx], { merge: true })
              .then(() => setCloudStatus('synced', 'Project updated in Firebase Cloud'))
              .catch(err => console.error('[Firebase] updateProject failed:', err));
          }
          return list[idx];
        }

        function deleteProject(projectId) {
          const filtered = getProjects().filter(p => p.id !== projectId);
          writeJSON(STORAGE_KEYS.PROJECTS, filtered);
          notifyListeners();

          if (firestoreDb) {
            deleteDoc(doc(firestoreDb, 'projects', projectId))
              .then(() => setCloudStatus('synced', 'Project deleted from Firebase Cloud'))
              .catch(err => console.error('[Firebase] deleteProject failed:', err));
          }
          return filtered;
        }

        // --- FAQs API ---
        function getFaqs() {
          const list = readJSON(STORAGE_KEYS.FAQS, DEFAULT_FAQS);
          return Array.isArray(list) ? list : [];
        }

        function saveFaq(faqInput) {
          const list = getFaqs();
          const newFaq = {
            id: 'faq-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            order: list.length,
            question: (faqInput.question || '').trim(),
            answer: (faqInput.answer || '').trim()
          };
          list.push(newFaq);
          writeJSON(STORAGE_KEYS.FAQS, list);
          notifyListeners();

          if (firestoreDb) {
            setDoc(doc(firestoreDb, 'faqs', newFaq.id), newFaq)
              .then(() => setCloudStatus('synced', 'FAQ saved to Firebase Cloud'))
              .catch(err => console.error('[Firebase] saveFaq failed:', err));
          }
          return newFaq;
        }

        function updateFaq(faqId, updates) {
          const list = getFaqs();
          const idx = list.findIndex(f => f.id === faqId);
          if (idx === -1) return null;
          list[idx] = {
            ...list[idx],
            question: updates.question !== undefined ? updates.question.trim() : list[idx].question,
            answer: updates.answer !== undefined ? updates.answer.trim() : list[idx].answer
          };
          writeJSON(STORAGE_KEYS.FAQS, list);
          notifyListeners();

          if (firestoreDb) {
            setDoc(doc(firestoreDb, 'faqs', faqId), list[idx], { merge: true })
              .then(() => setCloudStatus('synced', 'FAQ updated in Firebase Cloud'))
              .catch(err => console.error('[Firebase] updateFaq failed:', err));
          }
          return list[idx];
        }

        function deleteFaq(faqId) {
          const filtered = getFaqs()
            .filter(f => f.id !== faqId)
            .map((f, i) => ({ ...f, order: i }));
          writeJSON(STORAGE_KEYS.FAQS, filtered);
          notifyListeners();

          if (firestoreDb) {
            deleteDoc(doc(firestoreDb, 'faqs', faqId))
              .then(() => Promise.all(filtered.map(f => updateDoc(doc(firestoreDb, 'faqs', f.id), { order: f.order }))))
              .then(() => setCloudStatus('synced', 'FAQ removed from Firebase Cloud'))
              .catch(err => console.error('[Firebase] deleteFaq failed:', err));
          }
          return filtered;
        }

        function reorderFaq(faqId, direction) {
          const list = getFaqs();
          const idx = list.findIndex(f => f.id === faqId);
          if (idx === -1) return list;
          const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
          if (swapIdx < 0 || swapIdx >= list.length) return list;
          const temp = list[idx];
          list[idx] = list[swapIdx];
          list[swapIdx] = temp;
          const reindexed = list.map((f, i) => ({ ...f, order: i }));
          writeJSON(STORAGE_KEYS.FAQS, reindexed);
          notifyListeners();

          if (firestoreDb) {
            Promise.all(reindexed.map(f => setDoc(doc(firestoreDb, 'faqs', f.id), f, { merge: true })))
              .then(() => setCloudStatus('synced', 'FAQ order synced to Firebase Cloud'))
              .catch(err => console.error('[Firebase] reorderFaq failed:', err));
          }
          return reindexed;
        }

        // --- Client Questions & Replies API ---
        function getQuestions() {
          const list = readJSON(STORAGE_KEYS.QUESTIONS, DEFAULT_QUESTIONS);
          return Array.isArray(list) ? list : [];
        }

        function submitQuestion(input) {
          const list = getQuestions();
          const record = {
            id: 'q-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
            name: (input.name || 'Visitor').trim(),
            contact: (input.contact || '').trim(),
            question: (input.question || '').trim(),
            timestamp: new Date().toISOString(),
            answered: false,
            reply: '',
            publishedToFaq: false
          };
          list.unshift(record);
          writeJSON(STORAGE_KEYS.QUESTIONS, list);
          notifyListeners();

          if (firestoreDb) {
            setDoc(doc(firestoreDb, 'questions', record.id), record)
              .then(() => setCloudStatus('synced', 'Question synced to Firebase Cloud'))
              .catch(err => console.error('[Firebase] submitQuestion failed:', err));
          }
          return record;
        }

        function replyToQuestion(questionId, replyText, markAnswered = true) {
          const list = getQuestions();
          const idx = list.findIndex(q => q.id === questionId);
          if (idx === -1) return null;
          const cleanReply = (replyText || '').trim();
          list[idx] = {
            ...list[idx],
            reply: cleanReply,
            answered: markAnswered ? true : Boolean(cleanReply)
          };
          writeJSON(STORAGE_KEYS.QUESTIONS, list);
          notifyListeners();

          if (firestoreDb) {
            setDoc(doc(firestoreDb, 'questions', questionId), list[idx], { merge: true })
              .then(() => setCloudStatus('synced', 'Reply saved to Firebase Cloud'))
              .catch(err => console.error('[Firebase] replyToQuestion failed:', err));
          }
          return list[idx];
        }

        function togglePublishQuestion(questionId, publishState) {
          const list = getQuestions();
          const idx = list.findIndex(q => q.id === questionId);
          if (idx === -1) return null;
          list[idx] = {
            ...list[idx],
            publishedToFaq: typeof publishState === 'boolean' ? publishState : !list[idx].publishedToFaq
          };
          writeJSON(STORAGE_KEYS.QUESTIONS, list);
          notifyListeners();

          if (firestoreDb) {
            setDoc(doc(firestoreDb, 'questions', questionId), { publishedToFaq: list[idx].publishedToFaq }, { merge: true })
              .then(() => setCloudStatus('synced', 'Publication status synced to Firebase Cloud'))
              .catch(err => console.error('[Firebase] togglePublishQuestion failed:', err));
          }
          return list[idx];
        }

        // --- Auth Session API ---
        const ADMIN_USERNAME = 'SoftStreamsWebWork';
        const ADMIN_PASSWORD = '@Huss123ain_420';

        function isAuthenticated() {
          try {
            const raw = sessionStorage.getItem(SESSION_AUTH_KEY);
            if (!raw) return false;
            const parsed = JSON.parse(raw);
            return Boolean(parsed && parsed.authenticated && parsed.user === ADMIN_USERNAME);
          } catch {
            return false;
          }
        }

        function loginAdmin(username, password) {
          const u = (username || '').trim();
          const p = (password || '');
          if (u === ADMIN_USERNAME && p === ADMIN_PASSWORD) {
            try {
              sessionStorage.setItem(SESSION_AUTH_KEY, JSON.stringify({
                authenticated: true,
                user: ADMIN_USERNAME,
                loginAt: new Date().toISOString()
              }));
            } catch (e) {
              console.error('[Auth] sessionStorage error:', e);
            }
            return { ok: true };
          }
          return { ok: false, error: 'Invalid username or password. Please check your credentials.' };
        }

        function logoutAdmin() {
          try {
            sessionStorage.removeItem(SESSION_AUTH_KEY);
          } catch (e) {
            console.error('[Auth] logout error:', e);
          }
        }

        async function resetAllDemoData() {
          localStorage.removeItem(STORAGE_KEYS.SITE_DATA);
          localStorage.removeItem(STORAGE_KEYS.PROJECTS);
          localStorage.removeItem(STORAGE_KEYS.FAQS);
          localStorage.removeItem(STORAGE_KEYS.QUESTIONS);
          ensureLocalSeeded();
          notifyListeners();

          if (firestoreDb) {
            try {
              await setDoc(doc(firestoreDb, 'site', 'config'), structuredCloneSafe(DEFAULT_SITE_DATA));
              const existingProjs = await getDocs(collection(firestoreDb, 'projects'));
              await Promise.all(existingProjs.docs.map(d => deleteDoc(d.ref)));
              await Promise.all(DEFAULT_PROJECTS.map(p => setDoc(doc(firestoreDb, 'projects', p.id), p)));

              const existingFaqs = await getDocs(collection(firestoreDb, 'faqs'));
              await Promise.all(existingFaqs.docs.map(d => deleteDoc(d.ref)));
              await Promise.all(DEFAULT_FAQS.map(f => setDoc(doc(firestoreDb, 'faqs', f.id), f)));

              const existingQs = await getDocs(collection(firestoreDb, 'questions'));
              await Promise.all(existingQs.docs.map(d => deleteDoc(d.ref)));
              await Promise.all(DEFAULT_QUESTIONS.map(q => setDoc(doc(firestoreDb, 'questions', q.id), q)));

              setCloudStatus('synced', 'Default seed data synced to Firebase Cloud');
            } catch (err) {
              console.error('[Firebase] resetAllDemoData cloud sync error:', err);
            }
          }
        }

        return {
          initCloudSync,
          onChange,
          getCloudStatus,
          getSiteData,
          saveSiteData,
          getProjects,
          saveProject,
          updateProject,
          deleteProject,
          getFaqs,
          saveFaq,
          updateFaq,
          deleteFaq,
          reorderFaq,
          getQuestions,
          submitQuestion,
          replyToQuestion,
          togglePublishQuestion,
          isAuthenticated,
          loginAdmin,
          logoutAdmin,
          resetAllDemoData,
          makeProjectSvgDataUrl
        };
      })();
